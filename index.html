<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Quests</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#27306b">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quests">
<style>
@property --p{syntax:'<number>';initial-value:0;inherits:false}
:root{--bg:#eceef6;--card:#fff;--ink:#1d2140;--mute:#6a7090;--line:#dde0ee;--hero:#27306b;--acc:#4b5bd6;--gold:#ffc933;--ok:#1fa971;--okbg:#e5f6ee}
@media (prefers-color-scheme:dark){:root{--bg:#11142a;--card:#1b2044;--ink:#eceffd;--mute:#9aa2cc;--line:#2c336a;--hero:#252d68;--acc:#8c9bff;--gold:#ffc933;--ok:#4cd9a0;--okbg:#173a45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:28px 16px 48px}
main{width:100%;max-width:1000px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:26px 28px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.lvl{--p:0;flex:none;width:124px;height:124px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;transition:--p .7s}
.lvl>div{width:98px;height:98px;border-radius:50%;background:var(--hero);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvl small{font-size:11px;letter-spacing:.12em;opacity:.75;margin-bottom:3px}
.lvl b{font-size:38px;font-weight:800}
.lvl.pop{animation:pop .7s}
@keyframes pop{30%{transform:scale(1.18) rotate(-5deg)}60%{transform:scale(.96) rotate(3deg)}}
.hinfo{flex:1;min-width:260px}
.hinfo h1{margin:0;font-size:28px;line-height:1.15}
.xpl{margin:4px 0 16px;font-size:14px;opacity:.78}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{background:rgba(255,255,255,.12);border-radius:14px;padding:8px 16px;min-width:104px}
.stats b{display:block;font-size:22px;line-height:1.2}
.stats span{font-size:12px;opacity:.75}
.grid{display:grid;gap:0 28px;grid-template-columns:1fr}
@media (min-width:860px){.grid{grid-template-columns:1.25fr 1fr}}
h2{font-size:18px;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2 span{font-size:12px;font-weight:600;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 11px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:16px;padding:14px 16px;transition:background .2s,border-color .2s}
li.done{background:var(--okbg);border-left-color:var(--ok)}
li.done .t{color:var(--mute)}
.t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;cursor:text}
.chk{flex:none;width:36px;height:36px;border-radius:11px;border:2px solid var(--mute);background:var(--card);color:#fff;font-size:20px;font-weight:800;cursor:pointer;transition:transform .15s}
.chk:hover{transform:scale(1.08)}
li.done .chk{background:var(--ok);border-color:var(--ok)}
.dy{font-size:12px;color:var(--mute);white-space:nowrap}
.xp{font-size:13px;font-weight:800;background:var(--gold);border-radius:999px;padding:2px 11px;color:#1d2140;white-space:nowrap}
.del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px;line-height:1;padding:4px;border-radius:8px}
.del:hover{color:#d64545;background:var(--line)}
.float{position:absolute;right:70px;top:2px;font-weight:800;color:var(--ok);pointer-events:none;animation:fl 1.1s forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
form{display:flex;gap:10px;margin-top:14px}
input{flex:1;min-width:0;font:inherit;border-radius:12px;border:2px solid var(--line);padding:11px 14px;background:var(--card);color:var(--ink)}
input:focus{border-color:var(--acc);outline:none}
button.add{font:inherit;font-weight:700;border-radius:12px;border:0;padding:0 22px;background:var(--acc);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.empty{color:var(--mute);padding:22px;text-align:center;border:2px dashed var(--line);border-radius:16px}
.week{display:flex;gap:8px;height:150px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:12px;color:var(--mute)}
.col i{width:100%;max-width:30px;background:var(--acc);border-radius:8px;min-height:4px;opacity:.55}
.col.now{color:var(--ink);font-weight:800}.col.now i{background:var(--gold);opacity:1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--mute)}
.bd b{display:block;font-size:14px;color:var(--ink)}
.bd.got{border-color:var(--gold)}
.bd.lock{opacity:.5}
#toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:700;transition:transform .35s;z-index:9;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.foot{margin-top:26px;display:flex;gap:16px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0}
.sync{margin:14px 4px 0;font-size:13px;color:var(--mute)}
#auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#auth form{flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:360px;margin:0}
#auth h2{margin:0 0 4px}#auth p{margin:0;color:var(--mute);font-size:14px}#auth .err{color:#d64545;min-height:20px}
#auth .row{display:flex;gap:10px}#auth .row button{flex:1;padding:11px}
#auth .lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:14px;text-align:left;padding:0;cursor:pointer;text-decoration:underline}
#auth .alt{background:var(--card);color:var(--acc);border:2px solid var(--acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="lvl" id="lvbox"><div><small>LEVEL</small><b id="lv">1</b></div></div>
    <div class="hinfo">
      <h1 id="rank">Beginner</h1>
      <p class="xpl" id="xpl"></p>
      <div class="stats">
        <div><b id="streak">0</b><span>day streak</span></div>
        <div><b id="today">0/0</b><span>done today</span></div>
        <div><b id="totalxp">0</b><span>total XP</span></div>
      </div>
    </div>
  </section>

  <p class="sync" id="sync">Saved on this device only</p>
  <div class="grid">
    <div>
      <h2>Today's quests <span id="bonusnote"></span></h2>
      <ul id="list"></ul>
      <form id="f">
        <input id="name" placeholder="Add a daily quest, e.g. Study 1 hour" required maxlength="80" autocomplete="off">
        <button class="add" type="submit">Add</button>
      </form>
    </div>
    <div>
      <h2>Last 7 days <span>quests done</span></h2>
      <div class="week" id="week"></div>
      <h2>Badges <span id="bcount"></span></h2>
      <div class="badges" id="badges"></div>
      <div class="foot">
        <button id="exp">Download backup</button>
        <button id="imp">Restore backup</button>
        <button id="reset">Reset all progress</button>
        <button id="logout">Log out</button>
      </div>
    </div>
  </div>
  <input type="file" id="file" accept=".json" hidden>
</main>
<div id="auth"><form id="af"><h2>Daily Quests</h2><p>Log in to save your progress to your account.</p>
<input id="em" type="email" placeholder="Email" required autocomplete="email">
<input id="pw" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password">
<div class="err" id="aerr"></div>
<button type="button" id="fp" class="lnk">Forgot password?</button>
<div class="row"><button class="add" type="submit" id="li">Log in</button><button class="add alt" type="button" id="su">Create account</button></div></form></div>
<div id="toast" role="status"></div>

<script>
const KEY="daily-quests-v1";
const RANKS=[[1,"Beginner"],[3,"Apprentice"],[6,"Adventurer"],[10,"Challenger"],[20,"Veteran"],[35,"Expert"],[60,"Master"],[100,"Champion"],[200,"Hero"],[400,"Legend"],[700,"Mythic"],[999,"Godlike"]];
const rankOf=l=>RANKS.filter(r=>l>=r[0]).pop()[1];
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dstr(new Date());
const empty=()=>({tasks:[],xp:0,days:{},bonus:{},badges:{}});
let S=empty(),fresh=true;
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(empty(),JSON.parse(r));fresh=false}}catch(e){}
if(fresh)S.tasks=[{id:1,name:"Drink 2L of water",xp:10},{id:2,name:"Exercise 30 minutes",xp:30},{id:3,name:"Study or read 1 hour",xp:30}];
let user=null,pt;
const OWN="daily-quests-owner";
const setSync=m=>{const e=document.getElementById("sync");if(e)e.textContent=m};
const save=()=>{
  S._u=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(user&&window.cloud){clearTimeout(pt);pt=setTimeout(async()=>{
    try{await cloud.push(user.uid,JSON.stringify(S),S._u);setSync("Synced as "+user.email)}
    catch(e){setSync("Offline. Will sync when you are back online")}
  },800)}
};
function initCloud(){
  if(!window.cloud){setSync("Cloud not loaded. Saved on this device only");return}
  cloud.onUser(async u=>{
    user=u;
    document.getElementById("auth").style.display=u?"none":"flex";
    if(!u){setSync("Not logged in");return}
    try{
      const own=localStorage.getItem(OWN),d=await cloud.pull(u.uid);
      if(d&&d.json&&((d.u||0)>=(S._u||0)||(own&&own!==u.uid))){
        S=Object.assign(empty(),JSON.parse(d.json));
      }else if(own&&own!==u.uid){S=empty()}
      localStorage.setItem(OWN,u.uid);localStorage.setItem(KEY,JSON.stringify(S));
      render();
      await cloud.push(u.uid,JSON.stringify(S),S._u||Date.now());
      setSync("Synced as "+u.email);
    }catch(e){setSync("Offline. Saved on this device, will sync later")}
  });
}
const MAXL=999;
// Gap to the next level starts at 100 and grows by 50 each level: 100, 150, 200, 250...
// need(l) = total XP required to reach level l
const need=l=>100*(l-1)+25*(l-1)*(l-2);
const levelOf=xp=>{let l=1;while(l<MAXL&&xp>=need(l+1))l++;return l};
function streak(){
  let n=0,d=new Date();
  if(!(S.days[dstr(d)]>0))d.setDate(d.getDate()-1);
  while(S.days[dstr(d)]>0){n++;d.setDate(d.getDate()-1)}
  return n;
}
const BADGES=[
 ["first","First step","Complete any quest",()=>Object.values(S.days).some(v=>v>0)],
 ["perfect","Perfect day","Finish every quest in a day",()=>Object.keys(S.bonus).length>0],
 ["s3","On a roll","3-day streak",()=>streak()>=3],
 ["s7","Full week","7-day streak",()=>streak()>=7],
 ["s30","Unstoppable","30-day streak",()=>streak()>=30],
 ["l5","Level 5","Reach level 5",()=>levelOf(S.xp)>=5],
 ["l10","Level 10","Reach level 10",()=>levelOf(S.xp)>=10],
 ["l25","Level 25","Reach level 25",()=>levelOf(S.xp)>=25],
 ["l100","Level 100","Reach level 100",()=>levelOf(S.xp)>=100],
 ["l999","Godlike","Reach the max level, 999",()=>levelOf(S.xp)>=999],
 ["x1k","1,000 XP","Earn 1,000 XP",()=>S.xp>=1000],
 ["c100","Centurion","100 quests completed",()=>Object.values(S.days).reduce((a,b)=>a+b,0)>=100]
];
let tt;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000)}
// XP is set by the app. Every task starts at BASE XP on day 1 and earns +15% of BASE more
// for each extra day in a row (no cap), so streaks make leveling faster and faster.
const BASE=25,GROW=0.15;
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const reward=run=>Math.round(BASE*(1+GROW*run));
const prevRun=t=>{const y=yest();if(t.last===today())return t.undo&&t.undo.last===y?t.undo.run:0;return t.last===y?(t.run||0):0};
const projTotal=()=>S.tasks.reduce((a,t)=>a+(t.done===today()?(t.paid||BASE):reward(prevRun(t))),0);
function perfectBonus(){return Math.round(0.25*projTotal())} // 25% of the day's XP
function toggle(id){
  const t=S.tasks.find(x=>x.id===id),td=today(),before=levelOf(S.xp),msgs=[];let gain=0;
  if(t.done===td){
    S.xp=Math.max(0,S.xp-(t.paid||BASE));S.days[td]=Math.max(0,(S.days[td]||0)-1);
    t.done=null;t.last=t.undo?t.undo.last:null;t.run=t.undo?t.undo.run:0;
  }else{
    const pr=prevRun(t),g=reward(pr);
    t.undo={last:t.last,run:t.run||0};t.last=td;t.run=pr+1;t.done=td;t.paid=g;
    S.xp+=g;gain=g;S.days[td]=(S.days[td]||0)+1;
  }
  const all=S.tasks.length>0&&S.tasks.every(x=>x.done===td);
  if(all&&!S.bonus[td]){S.bonus[td]=perfectBonus();S.xp+=S.bonus[td];msgs.push("Perfect day! +"+S.bonus[td]+" bonus XP")}
  if(!all&&S.bonus[td]){S.xp=Math.max(0,S.xp-S.bonus[td]);delete S.bonus[td]}
  BADGES.forEach(b=>{if(!S.badges[b[0]]&&b[3]()){S.badges[b[0]]=td;msgs.push("Badge unlocked: "+b[1])}});
  const after=levelOf(S.xp);
  if(after>before)msgs.unshift("Level up! You reached level "+after);
  save();render();
  if(gain){const li=list.children[S.tasks.indexOf(t)];if(li){const fl=document.createElement("span");fl.className="float";fl.textContent="+"+gain+" XP";li.append(fl)}}
  if(after>before){const b=document.getElementById("lvbox");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}
  if(msgs.length)toast(msgs.join("  ·  "));
}
function render(){
  const td=today(),l=levelOf(S.xp),lo=need(l),hi=need(l+1);
  lv.textContent=l;
  rank.textContent=rankOf(l);
  lv.style.fontSize=l>99?"30px":"38px";
  if(l>=MAXL){lvbox.style.setProperty("--p",100);xpl.textContent="MAX LEVEL reached ("+S.xp.toLocaleString()+" XP total)"}
  else{lvbox.style.setProperty("--p",(S.xp-lo)/(hi-lo)*100);
  xpl.textContent=(S.xp-lo).toLocaleString()+" / "+(hi-lo).toLocaleString()+" XP to level "+(l+1)+" ("+S.xp.toLocaleString()+" total)"}
  streak_.textContent=streak();
  today_.textContent=S.tasks.filter(x=>x.done===td).length+"/"+S.tasks.length;
  bonusnote.textContent=S.bonus[td]?"Perfect day +"+S.bonus[td]+" XP":"Finish all for +"+perfectBonus()+" XP";
  totalxp.textContent=S.xp.toLocaleString();
  list.innerHTML="";
  if(!S.tasks.length)list.innerHTML='<div class="empty">No quests yet. Add your first daily task below.</div>';
  S.tasks.forEach(t=>{
    const li=document.createElement("li");if(t.done===td)li.className="done";
    const b=document.createElement("button");b.className="chk";b.textContent=t.done===td?"✓":"";
    b.setAttribute("aria-label","Toggle "+t.name);b.onclick=()=>toggle(t.id);
    const s=document.createElement("span");s.className="t";s.textContent=t.name;s.title="Double-click to rename";
    s.ondblclick=()=>{const n=prompt("Rename quest",t.name);if(n&&n.trim()){t.name=n.trim().slice(0,80);save();render()}};
    const done=t.done===td,pr=prevRun(t),x=document.createElement("span");x.className="xp";
    x.textContent="+"+(done?(t.paid||BASE):reward(pr));
    const dy=document.createElement("span");dy.className="dy";dy.textContent="Day "+(done?(t.run||1):pr+1);
    const d=document.createElement("button");d.className="del";d.textContent="×";d.setAttribute("aria-label","Delete "+t.name);
    d.onclick=()=>{if(t.done===td){S.xp=Math.max(0,S.xp-(t.paid||BASE));S.days[td]=Math.max(0,(S.days[td]||0)-1)}S.tasks=S.tasks.filter(y=>y.id!==t.id);save();render()};
    li.append(b,s,dy,x,d);list.append(li);
  });
  // week chart
  week.innerHTML="";
  const ds=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(d)}
  const max=Math.max(1,...ds.map(d=>S.days[dstr(d)]||0));
  ds.forEach((d,i)=>{
    const n=S.days[dstr(d)]||0,c=document.createElement("div");c.className="col"+(i===6?" now":"");
    c.innerHTML="<span>"+n+"</span><i style='height:"+(n/max*100*.62)+"%'></i><span>"+"SMTWTFS"[d.getDay()]+"</span>";
    week.append(c);
  });
  // badges
  badges.innerHTML="";
  BADGES.forEach(b=>{
    const e=document.createElement("div"),got=!!S.badges[b[0]];e.className="bd "+(got?"got":"lock");
    e.innerHTML="<b>"+(got?"★ ":"")+b[1]+"</b>"+b[2];badges.append(e);
  });
  bcount.textContent=Object.keys(S.badges).length+"/"+BADGES.length;
}
const streak_=document.getElementById("streak"),today_=document.getElementById("today");
f.onsubmit=e=>{
  e.preventDefault();
  const nm=document.getElementById("name");
  S.tasks.push({id:Date.now(),name:nm.value.trim(),xp:BASE});
  nm.value="";save();render();
};
exp.onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  a.download="daily-quests-backup-"+today()+".json";a.click();
};
imp.onclick=()=>file.click();
file.onchange=()=>{
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.tasks))throw 0;S=Object.assign(empty(),o);save();render();toast("Backup restored")}catch(e){toast("That file is not a valid backup")}};
  if(file.files[0])r.readAsText(file.files[0]);file.value="";
};
reset.onclick=()=>{if(confirm("Erase all XP, levels, badges and tasks?")){S=empty();save();render()}};
render();
const aerr=document.getElementById("aerr");
const go=async fn=>{aerr.textContent="";aerr.style.color="";try{await fn(em.value.trim(),pw.value)}catch(e){aerr.textContent=(e.code||"").replace("auth/","").replace(/-/g," ")||"Something went wrong"}};
af.onsubmit=e=>{e.preventDefault();go(cloud.login)};
su.onclick=()=>{if(af.reportValidity())go(cloud.signup)};
fp.onclick=async()=>{
  aerr.style.color="";
  if(!em.value.trim()){aerr.textContent="Type your email above first";return}
  try{await cloud.reset(em.value.trim());aerr.style.color="var(--ok)";aerr.textContent="Reset link sent. Check your inbox and spam folder"}
  catch(e){aerr.textContent=(e.code||"").replace("auth/","").replace(/-/g," ")||"Something went wrong"}
};
logout.onclick=()=>cloud.logout();
window.addEventListener("cloudready",initCloud);
if(window.cloud)initCloud();
setInterval(render,60000); // un-tick tasks when a new day starts
</script>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
window.cloud={
  onUser:cb=>onAuthStateChanged(auth,cb),
  login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
  signup:(e,p)=>createUserWithEmailAndPassword(auth,e,p),
  logout:()=>signOut(auth),
  reset:e=>sendPasswordResetEmail(auth,e),
  pull:async uid=>{const s=await getDoc(doc(db,"users",uid));return s.exists()?s.data():null},
  push:(uid,json,u)=>setDoc(doc(db,"users",uid),{json,u})
};
window.dispatchEvent(new Event("cloudready"));
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
